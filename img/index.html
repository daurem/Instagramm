<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/png" href="./img/insta-fav.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Instagram</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#1f1f23;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.container{
    width:390px;
}

h2{
    font-size:34px;
    margin-bottom:35px;
    font-weight:700;
}

.input{
    width:100%;
    height:58px;
    background:#1f1f23;
    border:1px solid #575757;
    border-radius:18px;
    padding:0 20px;
    color:white;
    font-size:17px;
    outline:none;
    margin-bottom:15px;
}

.input::placeholder{
    color:#8f9499;
}

.login{
    width:100%;
    height:56px;
    border:none;
    border-radius:30px;
    background:#0b5ed7;
    color:white;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
    margin-top:18px;
}

.login:hover{
    background:#1877f2;
}

.forgot{
    display:block;
    text-align:center;
    color:white;
    text-decoration:none;
    margin:30px 0 55px;
    font-size:20px;
    font-weight:600;
}

.btn{
    width:100%;
    height:58px;
    border-radius:30px;
    border:1px solid #575757;
    background:transparent;
    color:white;
    font-size:21px;
    cursor:pointer;
    margin-bottom:18px;
}

.create{
    border:2px solid #2b8cff;
    color:#2b8cff;
}

.meta{
    text-align:center;
    color:#d8d8d8;
    font-size:34px;
    margin-top:30px;
    font-weight:600;
}

.fb{
    color:#1877f2;
    font-weight:700;
    margin-right:8px;
}

</style>
</head>

<body>

<div class="container">

<h2>Войти в Instagram</h2>

<input class="input"
placeholder="Имя пользователя, номер мобильного телефона или электронный адрес">

<input class="input"
type="password"
placeholder="Пароль">

<button class="login">
Войти
</button>

<a href="#" class="forgot">
Забыли пароль?
</a>

<button class="btn">
<span class="fb">f</span>
Войти через Facebook
</button>

<button class="btn create">
Создать новый аккаунт
</button>

<div class="meta">
∞ Meta
</div>

</div>

</body>
</html>
